<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghosht — Multi-Category Architecture</title>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0c0c0e;
            --surface-color: #141417;
            --border-color: #26262c;
            --text-primary: #f4f4f5;
            --text-secondary: #91919d;
            --transition-speed: 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.05em;
            color: var(--text-primary);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 280px;
            gap: 1.25rem;
        }

        .bento-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color var(--transition-speed);
        }

        .bento-card:hover {
            border-color: var(--text-secondary);
        }

        .col-span-2 { grid-column: span 2; }
        .row-span-2 { grid-row: span 2; }

        .card-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 400;
            margin-top: 0.5rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background var(--transition-speed), color var(--transition-speed);
        }

        .action-btn:hover {
            background: var(--text-primary);
            color: var(--bg-color);
        }

        .hero-card {
            background: linear-gradient(135deg, #141417 0%, #1c1c21 100%);
            justify-content: center;
        }

        .hero-card .card-title {
            font-size: 2.25rem;
            max-width: 500px;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        @media (max-width: 1024px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
            .col-span-2 { grid-column: span 2; }
            .row-span-2 { grid-row: span 1; }
        }

        @media (max-width: 640px) {
            .bento-grid { grid-template-columns: 1fr; }
            .col-span-2 { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="#" class="logo">GHOSHT // 360</a>
            <div class="nav-links">
                <span>[ catalog ]</span>
                <span>[ hardware ]</span>
                <span>[ cart (0) ]</span>
            </div>
        </header>

        <main class="bento-grid">
            <div class="bento-card col-span-2 row-span-2 hero-card">
                <div>
                    <span class="card-meta">SYSTEM 01 // FLAGSHIP RELEASE</span>
                    <h1 class="card-title">Engineered minimalism for modern workspaces.</h1>
                </div>
                <div class="card-footer">
                    <span class="price">$340.00 USD</span>
                    <button class="action-btn">EXPLORE SPECIFICATION</button>
                </div>
            </div>

            <div class="bento-card">
                <div>
                    <span class="card-meta">AUDIO // HARDWARE</span>
                    <h2 class="card-title">TX-P Portable Receiver</h2>
                </div>
                <div class="card-footer">
                    <span class="price">$195.00</span>
                    <button class="action-btn">+ ADD</button>
                </div>
            </div>

            <div class="bento-card">
                <div>
                    <span class="card-meta">APPAREL // TEXTILE</span>
                    <h2 class="card-title">Heavyweight Modular Shell</h2>
                </div>
                <div class="card-footer">
                    <span class="price">$220.00</span>
                    <button class="action-btn">+ ADD</button>
                </div>
            </div>

            <div class="bento-card">
                <div>
                    <span class="card-meta">OBJECTS // WORKSPACE</span>
                    <h2 class="card-title">Anodized Desk Block</h2>
                </div>
                <div class="card-footer">
                    <span class="price">$85.00</span>
                    <button class="action-btn">+ ADD</button>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
