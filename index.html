<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KRA3T6 | Services, Tools & Products</title>

  <meta
    name="description"
    content="KRA3T6 offers services, IT tools, automation macros, blogs and selected products."
  >

  <style>
    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f2;
      color: #111;
      line-height: 1.5;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       VARIABLES
    ========================= */

    :root {
      --black: #111111;
      --white: #ffffff;
      --bg: #f5f5f2;
      --gray: #6c6c6c;
      --border: #ddddda;
      --orange: #ff5a1f;
      --yellow: #ffd84d;
      --blue: #4267ff;
      --green: #19a463;
      --radius: 22px;
    }

    /* =========================
       LAYOUT
    ========================= */

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    section {
      scroll-margin-top: 90px;
    }

    .section {
      padding: 100px 0;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(245, 245, 242, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo-box {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--black);
      color: white;
      border-radius: 9px;
      font-size: 14px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .nav-links a,
    .dropdown-button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      color: var(--black);
    }

    .nav-links a:hover,
    .dropdown-button:hover {
      background: #e9e9e5;
    }

    .dropdown-item {
      position: relative;
    }

    .dropdown-button {
      cursor: pointer;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      width: 220px;
      padding: 8px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0,0,0,.1);

      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: .2s ease;
    }

    .dropdown-item:hover .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown a {
      display: block;
      width: 100%;
      padding: 10px 12px;
    }

    .dropdown a:hover {
      background: #f0f0ed;
    }

    .nav-contact {
      padding: 11px 16px;
      border-radius: 999px;
      background: var(--black);
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .nav-contact:hover {
      background: var(--orange);
    }

    .menu-button {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      font-size: 20px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      right: -180px;
      top: -180px;
      background: rgba(255, 216, 77, .35);
      border-radius: 50%;
      filter: blur(30px);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      left: -180px;
      bottom: -200px;
      background: rgba(66, 103, 255, .15);
      border-radius: 50%;
      filter: blur(30px);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      padding: 80px 0;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
    }

    .hero h1 {
      max-width: 1000px;
      font-size: clamp(55px, 9vw, 110px);
      line-height: .88;
      letter-spacing: -6px;
      font-weight: 800;
    }

    .hero h1 span {
      color: var(--orange);
    }

    .hero-text {
      max-width: 650px;
      margin-top: 30px;
      color: var(--gray);
      font-size: 18px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid var(--black);
      transition: .2s ease;
    }

    .button-black {
      background: var(--black);
      color: white;
    }

    .button-white {
      background: white;
      color: var(--black);
    }

    .button:hover {
      transform: translateY(-3px);
    }

    /* =========================
       SECTION HEADINGS
    ========================= */

    .eyebrow {
      color: var(--gray);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--orange);
    }

    .section-title {
      max-width: 760px;
      font-size: clamp(38px, 6vw, 65px);
      line-height: .95;
      letter-spacing: -3px;
    }

    .section-text {
      max-width: 650px;
      margin-top: 18px;
      color: var(--gray);
      font-size: 17px;
    }

    /* =========================
       BENTO
    ========================= */

    .bento-section {
      background: var(--black);
      color: white;
    }

    .bento-section .eyebrow {
      color: #999;
    }

    .bento-section .section-text {
      color: #999;
    }

    .bento {
      margin-top: 50px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 210px;
      gap: 15px;
    }

    .bento-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: .3s ease;
    }

    .bento-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 60px rgba(0,0,0,.3);
    }

    .bento-card h3 {
      font-size: 32px;
      letter-spacing: -1.5px;
    }

    .bento-card p {
      max-width: 400px;
      margin-top: 8px;
      font-size: 14px;
      opacity: .72;
    }

    .bento-card strong {
      font-size: 13px;
    }

    .services-box {
      grid-column: span 7;
      grid-row: span 2;
      background: #f0f0ec;
      color: var(--black);
    }

    .tools-box {
      grid-column: span 5;
      background: var(--blue);
    }

    .macros-box {
      grid-column: span 5;
      background: var(--orange);
    }

    .blog-box {
      grid-column: span 4;
      background: #292929;
    }

    .products-box {
      grid-column: span 8;
      background: var(--yellow);
      color: var(--black);
    }

    .bento-icon {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }

    .pill {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.5);
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       CARDS
    ========================= */

    .card-grid {
      margin-top: 50px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      padding: 28px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 270px;
      transition: .3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,.08);
    }

    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: #eeeeeb;
      border-radius: 13px;
      font-size: 22px;
    }

    .card h3 {
      margin-top: 35px;
      font-size: 25px;
      letter-spacing: -.7px;
    }

    .card p {
      margin-top: 8px;
      color: var(--gray);
      font-size: 14px;
    }

    .card-link {
      display: inline-block;
      margin-top: 25px;
      font-size: 13px;
      font-weight: 700;
    }

    .card-link:hover {
      color: var(--orange);
    }

    /* =========================
       DARK TOOLS
    ========================= */

    .dark-section {
      background: #111;
      color: white;
    }

    .dark-section .section-text {
      color: #999;
    }

    .tool-grid {
      margin-top: 50px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .tool {
      padding: 28px;
      background: #1c1c1c;
      border: 1px solid #303030;
      border-radius: 20px;
      transition: .3s ease;
    }

    .tool:hover {
      transform: translateY(-5px);
      border-color: #555;
    }

    .tool h3 {
      font-size: 28px;
    }

    .tool p {
      margin-top: 8px;
      color: #999;
    }

    .tool-footer {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      color: #777;
      font-size: 12px;
    }

    .available {
      color: #52d58b;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .product-image {
      height: 230px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .product-image::before {
      content: "";
      width: 190px;
      height: 190px;
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.25);
    }

    .masala {
      background: #d97848;
    }

    .tea {
      background: #aebf7e;
    }

    .dry-fruits {
      background: #d59c55;
    }

    .package {
      position: relative;
      z-index: 1;
      width: 120px;
      height: 145px;
      background: white;
      border-radius: 14px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 20px 40px rgba(0,0,0,.15);
    }

    .product-content {
      padding: 24px;
    }

    .product-category {
      color: var(--gray);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .product-content h3 {
      margin-top: 7px;
      font-size: 27px;
    }

    .product-content p {
      margin-top: 7px;
      color: var(--gray);
      font-size: 14px;
    }

    .product-bottom {
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price {
      font-size: 17px;
      font-weight: 800;
    }

    .small-button {
      padding: 9px 13px;
      border: 0;
      border-radius: 9px;
      background: var(--black);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .small-button:hover {
      background: var(--orange);
    }

    /* =========================
       BLOG
    ========================= */

    .blog-grid {
      margin-top: 50px;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 15px;
    }

    .blog-card {
      min-height: 290px;
      padding: 27px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: .3s ease;
    }

    .blog-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,.08);
    }

    .tag {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 999px;
      background: #eeeeeb;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .blog-card h3 {
      margin-top: 25px;
      font-size: 27px;
      line-height: 1.05;
    }

    .blog-card p {
      margin-top: 10px;
      color: var(--gray);
      font-size: 14px;
    }

    .date {
      color: #999;
      font-size: 12px;
    }

    /* =========================
       ABOUT
    ========================= */

    .about-grid {
      margin-top: 50px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .about-big {
      font-size: clamp(35px, 5vw, 55px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
    }

    .about-copy {
      color: var(--gray);
      font-size: 16px;
    }

    .about-copy + .about-copy {
      margin-top: 18px;
    }

    /* =========================
       CONTACT
    ========================= */

    .contact-section {
      background: var(--orange);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .contact-text {
      margin-top: 20px;
      max-width: 550px;
      color: rgba(0,0,0,.65);
    }

    .contact-form {
      padding: 28px;
      background: white;
      border-radius: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #fafafa;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--black);
      background: white;
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: var(--black);
      color: white;
      font-weight: 700;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 55px 0 25px;
      background: var(--black);
      color: white;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 35px;
      padding-bottom: 45px;
      border-bottom: 1px solid #303030;
    }

    .footer-description {
      max-width: 320px;
      margin-top: 15px;
      color: #888;
      font-size: 14px;
    }

    .footer-column h4 {
      margin-bottom: 14px;
      color: #777;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer-column a {
      display: block;
      margin-bottom: 8px;
      color: #bbb;
      font-size: 14px;
    }

    .footer-column a:hover {
      color: white;
    }

    .footer-bottom {
      padding-top: 22px;
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 12px;
    }

    /* =========================
       ANIMATION
    ========================= */

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .6s ease, transform .6s ease;
    }

    .reveal.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .nav-links,
      .nav-contact {
        display: none;
      }

      .menu-button {
        display: block;
      }

      .nav.mobile-open {
        position: relative;
      }

      .nav.mobile-open .nav-links {
        display: flex;
        position: absolute;
        left: 0;
        right: 0;
        top: 66px;
        flex-direction: column;
        align-items: stretch;
        padding: 10px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 15px;
        box-shadow: 0 15px 40px rgba(0,0,0,.1);
      }

      .nav.mobile-open .nav-links a,
      .nav.mobile-open .dropdown-button {
        width: 100%;
        justify-content: space-between;
      }

      .nav.mobile-open .dropdown {
        position: static;
        width: 100%;
        display: none;
        opacity: 1;
        visibility: visible;
        transform: none;
        box-shadow: none;
        border: 0;
      }

      .nav.mobile-open .dropdown-item.open .dropdown {
        display: block;
      }

      .bento {
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 220px;
      }

      .services-box {
        grid-column: span 2;
      }

      .tools-box,
      .macros-box {
        grid-column: span 1;
      }

      .blog-box {
        grid-column: span 1;
      }

      .products-box {
        grid-column: span 2;
      }

      .card-grid,
      .product-grid {
        grid-template-columns: 1fr 1fr;
      }

      .blog-grid {
        grid-template-columns: 1fr 1fr;
      }

      .blog-card:first-child {
        grid-column: span 2;
      }

      .about-grid,
      .contact-grid {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {

      .container {
        width: calc(100% - 24px);
      }

      .section {
        padding: 70px 0;
      }

      .hero h1 {
        letter-spacing: -3px;
      }

      .bento {
        grid-template-columns: 1fr;
      }

      .services-box,
      .tools-box,
      .macros-box,
      .blog-box,
      .products-box {
        grid-column: span 1;
        min-height: 230px;
      }

      .card-grid,
      .product-grid,
      .tool-grid,
      .blog-grid {
        grid-template-columns: 1fr;
      }

      .blog-card:first-child {
        grid-column: span 1;
      }

      .footer-grid {
        grid-template-columns: 1fr;
      }

      .footer-bottom {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        transition: none !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="container">

      <nav class="nav" id="nav">

        <a href="#home" class="logo">
          <span class="logo-box">K</span>
          KRA3T6
        </a>

        <ul class="nav-links">

          <li>
            <a href="#home">Home</a>
          </li>

          <li class="dropdown-item">

            <button
              class="dropdown-button"
              type="button"
              onclick="t
