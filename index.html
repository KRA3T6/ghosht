<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>KRA3T6 — Services, Tools & Products</title>

  <meta
    name="description"
    content="KRA3T6 offers digital services, IT tools, macros, useful resources, and curated products including masala, tea and dry fruits."
  />

  <meta name="theme-color" content="#f7f7f5" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #f7f7f5;
      color: #111111;
      line-height: 1.5;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --black: #111111;
      --muted: #6d6d6d;
      --border: #deded9;
      --orange: #ff5a1f;
      --yellow: #ffd84d;
      --blue: #3764ff;
      --green: #1e9e63;
      --radius: 24px;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.07);
    }

    /* =========================================================
       GLOBAL
    ========================================================= */

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .section {
      padding: 110px 0;
      scroll-margin-top: 100px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
    }

    .section-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(36px, 5vw, 64px);
      line-height: 0.98;
      letter-spacing: -0.045em;
      max-width: 760px;
    }

    .section-description {
      margin-top: 20px;
      max-width: 650px;
      color: var(--muted);
      font-size: 17px;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(247, 247, 245, 0.88);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.05em;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--black);
      color: white;
      border-radius: 10px;
      font-size: 14px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 5px;
      list-style: none;
    }

    .nav-links > li {
      position: relative;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .nav-link:hover {
      background: #eaeae6;
    }

    .dropdown-arrow {
      font-size: 10px;
      opacity: 0.6;
    }

    /* Dropdown */

    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 230px;
      padding: 8px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);

      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: 0.2s ease;
    }

    .has-dropdown:hover .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown a {
      display: block;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
    }

    .dropdown a:hover {
      background: #f1f1ee;
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 7px 4px;
    }

    .header-contact {
      padding: 11px 17px;
      border-radius: 999px;
      background: var(--black);
      color: white;
      font-size: 13px;
      font-weight: 700;
      transition: 0.2s ease;
      white-space: nowrap;
    }

    .header-contact:hover {
      transform: translateY(-2px);
      background: var(--orange);
    }

    /* Mobile menu */

    .menu-toggle {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      font-size: 20px;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      position: relative;
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      padding: 90px 0;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      top: -300px;
      right: -250px;
      border-radius: 50%;
      background: rgba(255, 216, 77, 0.3);
      filter: blur(30px);
      pointer-events: none;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      bottom: -300px;
      left: -200px;
      border-radius: 50%;
      background: rgba(55, 100, 255, 0.13);
      filter: blur(50px);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(30, 158, 99, 0.1);
    }

    .hero h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(58px, 9vw, 116px);
      line-height: 0.86;
      letter-spacing: -0.075em;
      max-width: 1050px;
    }

    .hero h1 span {
      color: var(--orange);
    }

    .hero-description {
      max-width: 650px;
      margin-top: 30px;
      color: #555;
      font-size: clamp(17px, 2vw, 20px);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 12px;
      border: 1px solid var(--black);
      font-weight: 700;
      font-size: 14px;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .btn-primary {
      background: var(--black);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .btn-secondary {
      background: white;
      color: var(--black);
    }

    .btn-secondary:hover {
      transform: translateY(-3px);
      background: #eeeeeb;
    }

    /* =========================================================
       BENTO
    ========================================================= */

    .bento-section {
      background: var(--black);
      color: white;
    }

    .bento-section .eyebrow {
      color: #aaa;
    }

    .bento-section .section-description {
      color: #a8a8a8;
    }

    .bento-grid {
      margin-top: 55px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 220px;
      gap: 16px;
    }

    .bento-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition:
        transform 0.35s cubic-bezier(.2,.8,.2,1),
        box-shadow 0.35s ease;
    }

    .bento-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
    }

    .bento-card h3 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .bento-card p {
      max-width: 350px;
      font-size: 14px;
      opacity: 0.72;
    }

    .bento-number {
      position: absolute;
      top: 22px;
      right: 25px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 12px;
      opacity: 0.5;
    }

    .bento-icon {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .bento-services {
      grid-column: span 7;
      grid-row: span 2;
      background: #f4f4f0;
      color: var(--black);
    }

    .bento-tools {
      grid-column: span 5;
      background: var(--blue);
    }

    .bento-macros {
      grid-column: span 5;
      background: var(--orange);
    }

    .bento-blog {
      grid-column: span 4;
      background: #272727;
    }

    .bento-products {
      grid-column: span 8;
      background: var(--yellow);
      color: var(--black);
    }

    .bento-products-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .product-pill {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================================================
       SERVICES
    ========================================================= */

    .service-grid {
      margin-top: 55px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .service-card {
      padding: 30px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 270px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.3s ease;
    }

    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
      border-color: #bdbdb8;
    }

    .service-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #f0f0ed;
      font-size: 22px;
    }

    .service-card h3 {
      margin-top: 35px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 25px;
      letter-spacing: -0.03em;
    }

    .service-card p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-weight: 700;
      font-size: 13px;
    }

    .text-link:hover {
      color: var(--orange);
    }

    /* =========================================================
       TOOLS
    ========================================================= */

    .dark-section {
      background: #111;
      color: white;
    }

    .dark-section .section-description {
      color: #999;
    }

    .tool-grid {
      margin-top: 50px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .tool-card {
      border: 1px solid #303030;
      background: #1b1b1b;
      border-radius: 20px;
      padding: 30px;
      transition: 0.3s ease;
    }

    .tool-card:hover {
      transform: translateY(-5px);
      border-color: #555;
    }

    .tool-card h3 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 30px;
    }

    .tool-card p {
      margin-top: 10px;
      color: #999;
    }

    .tool-meta {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #777;
      font-size: 12px;
    }

    .tool-status {
      color: #57d48e;
    }

    /* =========================================================
       PRODUCTS
    ========================================================= */

    .product-grid {
      margin-top: 55px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .product-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow);
    }

    .product-image {
      height: 250px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      filter: blur(5px);
    }

    .masala-image {
      background: #e87745;
    }

    .tea-image {
      background: #b7c88c;
    }

    .dryfruit-image {
      background: #d8a15b;
    }

    .product-symbol {
      position: relative;
      z-index: 2;
      width: 120px;
      height: 150px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      font-family: "Space Grotesk", sans-serif;
      font-size: 28px;
      font-weight: 700;
    }

    .product-content {
      padding: 24px;
    }

    .product-category {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .product-card h3 {
      margin-top: 8px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 26px;
    }

    .product-card p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .product-bottom {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .price {
      font-weight: 800;
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
    }

    .small-btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--black);
      background: var(--black);
      color: white;
      font-size: 12px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .small-btn:hover {
      background: var(--orange);
      border-color: var(--orange);
    }

    /* =========================================================
       BLOG
    ========================================================= */

    .blog-grid {
      margin-top: 50px;
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 16px;
    }

    .blog-card {
      min-height: 310px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 27px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: 0.3s ease;
    }

    .blog-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .blog-tag {
      display: inline-flex;
      width: fit-content;
      padding: 6px 9px;
      background: #eeeeeb;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .blog-card h3 {
      margin-top: 25px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 27px;
      line-height: 1.05;
    }

    .blog-card p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .blog-date {
      color: #999;
      font-size: 12px;
    }

    /* =========================================================
       ABOUT
    ========================================================= */

    .about-grid {
      margin-top: 55px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .about-large {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(32px, 4vw, 52px);
      line-height: 1.02;
      letter-spacing: -0.05em;
    }

    .about-text {
      color: var(--muted);
      font-size: 16px;
    }

    .about-text + .about-text {
      margin-top: 18px;
    }

    .about-stats {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: white;
    }

    .stat strong {
      display: block;
      font-family: "Space Grotesk", sans-serif;
      font-size: 28px;
    }

    .stat span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================================================
       CONTACT
    ========================================================= */

    .contact-section {
      background: var(--orange);
    }

    .contact-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .contact-section .section-title {
      max-width: 600px;
    }

    .contact-description {
      margin-top: 20px;
      max-width: 550px;
      color: rgba(0, 0, 0, 0.65);
    }

    .contact-form {
      padding: 30px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.15);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      outline: none;
      background: #fafafa;
      transition: 0.2s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--black);
      background: white;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-submit {
      width: 100%;
      margin-top: 5px;
      background: var(--black);
      color: white;
      border: none;
      min-height: 48px;
      border-radius: 10px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .form-submit:hover {
      transform: translateY(-2px);
      background: #252525;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      background: var(--black);
      color: white;
      padding: 60px 0 30px;
    }

    .footer-top {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1
